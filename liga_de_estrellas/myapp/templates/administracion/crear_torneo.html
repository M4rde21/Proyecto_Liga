{% extends 'administracion/base2.html' %}

{% block content %}
<!-- Asegúrate de tener Bootstrap en tu proyecto -->
<link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">

<div class="container mt-5">
    <!-- Contenedor con fondo negro y borde blanco -->
    <div class="p-4 mx-auto" style="background-color: black; color: white; max-width: 600px; border: 2px solid white; border-radius: 10px;">

        <!-- Título centrado -->
        <div class="text-center mb-4">
            <h1>Crear Torneo</h1>
        </div>

        <!-- Formulario -->
        <form method="post">
            {% csrf_token %}
            <div class="form-group">
                {{ form.as_p }}
            </div>
            <button type="submit" class="btn btn-success btn-block">
                <i class="fas fa-save"></i> Guardar
            </button>
        </form>

        <!-- Botón Volver atrás -->
        <form action="{% url 'torneos_adm' %}" method="get" style="display:inline;">
            <button type="submit" class="btn btn-danger btn-block mt-2">
                <i class="fas fa-arrow-left"></i> Volver atrás
            </button>
        </form>
    </div>
</div>

{% endblock %}
