{% load static %}

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ADMINISTRACION</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" rel="stylesheet">

    <style>
        body {
            height: 100vh; /* Ocupa toda la altura de la ventana */
            margin: 0; 
            background-color: black;
            background-image: url("{% static 'images/fondo.jpg' %}"); 
            background-size: cover; 
            background-position: center; 
            background-repeat: no-repeat; 
            background-attachment: fixed; 
        }

        body::-webkit-scrollbar {
            display: none; 
        }

        .custom-nav {
            position: fixed;
            top: 0;
            left: 0; 
            height: 100%; 
            width: 20%; 
            background-color: rgba(0, 0, 0, 0.8); 
            display: flex;
            flex-direction: column;
            justify-content: flex-start; 
            align-items: center;
            z-index: 1000; 
            padding: 20px;
        }

        .custom-nav img {
            max-width: 80%;
            height: 50px; 
            margin-bottom: 20px;
        }

        .custom-nav h3 {
            color: white; 
            margin-top: 10px;
        }

        .custom-nav a {
            color: white; 
            display: flex;
            align-items: center; 
            font-size: 0.9rem;
        }

        .custom-nav a .fas {
            margin-right: 10px; 
        }

        .flex-grow-1 {
            flex-grow: 1; 
        }

        .logout {
            margin-top: auto; 
        }

        .content {
            margin-left: 20%; 
            padding: 20px; 
        }

        ul.list-unstyled {
            padding-left: 0;
            font-size: 0.85rem;
        }

        ul.list-unstyled li a:hover {
            color: #f8f9fa; 
        }

        .modal-content {
            background-color: black; 
            border: 2px solid white; 
            color: white; 
        }

        .modal-header {
            border-bottom: 1px solid white;
        }

        .modal-footer {
            border-top: 1px solid white;
        }

        .btn-confirm {
            background-color:  rgb(172, 21, 21);
            color: white;
            border: 1px solid white;
        }

        .btn-cancel {
            background-color: gray;
            color: white;
            border: 1px solid white;
        }

    </style>
</head>
<body>

    <div class="d-flex">
        <nav class="custom-nav"> 
            <a class="navbar-brand" href="{% url 'inicio' %}">
                <img src="{% static 'images/Logo_Liga_B.png' %}" alt="Imagen del Logo" class="img-fluid">
            </a>

            <h3>Menú</h3>

            <div class="flex-grow-1 p-3"> 
                <ul class="list-unstyled">
                    <li class="nav-item mb-2">
                        <a class="nav-link" href="{% url 'resumen_adm' %}">
                            <i class="fas fa-info-circle"></i> Resumen
                        </a>
                    </li>
                    <li class="nav-item mb-2">
                        <a class="nav-link" href="{% url 'torneos_adm' %}">
                            <i class="fas fa-trophy"></i> Liga / Copa
                        </a>
                    </li>
                    <li class="nav-item mb-2">
                        <a class="nav-link" href="{% url 'temporadas_adm' %}">
                            <i class="fas fa-calendar-alt"></i> Temporadas
                        </a>
                    </li>
                    <li class="nav-item mb-2">
                        <a class="nav-link" href="{% url 'entrenadores' %}">
                            <i class="fas fa-chalkboard-teacher"></i> Entrenadores / Delegados
                        </a>
                    </li>
                    <li class="nav-item mb-2">
                        <a class="nav-link" href="{% url 'equipos' %}">
                            <i class="fas fa-users"></i> Equipos
                        </a>
                    </li>
                    <li class="nav-item mb-2">
                        <a class="nav-link" href="{% url 'jugadores' %}">
                            <i class="fas fa-user"></i> Jugadores
                        </a>
                    </li>                 
                </ul>
            </div>

            <div class="logout p-3">
                <a class="nav-link" href="#" data-toggle="modal" data-target="#logoutModal">
                    <i class="fas fa-sign-out-alt"></i> CERRAR SESION
                </a>
            </div>
        </nav>

        <div class="content flex-grow-1">
            {% block content %}
            {% endblock %}
        </div>
    </div>

    <div class="modal fade" id="logoutModal" tabindex="-1" role="dialog" aria-labelledby="logoutModalLabel" aria-hidden="true">
        <div class="modal-dialog" role="document">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="logoutModalLabel">Confirmar Cierre de Sesión</h5>
                    <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>
                <div class="modal-body">
                    ¿Estás seguro que deseas cerrar sesión?
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-cancel" data-dismiss="modal">Cancelar</button>
                    <a href="{% url 'logout' %}" class="btn btn-confirm">Cerrar Sesión</a>
                </div>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.0.7/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>

</body>
</html>
