{% extends 'administracion/base2.html' %}

{% block content %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Importar Jugador al Equipo</title>
</head>
<body>
    <h1>Importar Jugador al Equipo</h1>
    
    <form action="{% url 'importar_jugador_equipo' temporada.id zona.id equipo.id %}" method="post">
        {% csrf_token %}
        
        <label for="jugador">Selecciona un jugador:</label>
        <select name="jugador" id="jugador">
            {% for jugador in jugadores %}
                <option value="{{ jugador.id }}">{{ jugador.nombre_jugador }} {{ jugador.apellido_jugador }}</option>
            {% endfor %}
        </select>
            <button type="submit">CONFIRMAR</button>
    </form>
    <a href="{% url 'equipo_importado' temporada.id zona.id equipo.id %}">
        <button>CANCELAR</button>
    </a>
    {% if messages %}
        <ul>
            {% for message in messages %}
                <li>{{ message }}</li>
            {% endfor %}
        </ul>
    {% endif %}
</body>
</html>
{% endblock %}
