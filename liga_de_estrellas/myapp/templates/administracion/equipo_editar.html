{% extends 'administracion/base2.html' %}

{% block content %}
<style>
    body {
    overflow-x: hidden;
}
</style>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">

<div class="container-fluid mt-5">
    <div class="p-4 text-center" style="background-color: black; color: white; width: 100%; border: 2px solid white; border-radius: 10px;">
        <h2 class="mb-4">EDITAR EQUIPO</h2>

        {% if error %}
            <div class="alert alert-danger" role="alert" style="color: black; background-color: white; border-radius: 5px;">
                {{ error }}
            </div>
        {% endif %}

        <form method="POST" enctype="multipart/form-data" style="max-width: 500px; margin: 0 auto;">
            {% csrf_token %}
            
            <div class="form-group text-center">
                <div class="image-preview mx-auto" style="width: 150px; height: 150px; border-radius: 50%; background-color: white; overflow: hidden;">
                    {% if logo_url %}
                        <img id="logoPreview" src="{{ logo_url }}" alt="Previsualización del logo" style="width: 100%; height: 100%; object-fit: cover;">
                    {% else %}
                        <img id="logoPreview" src="media/logos/logo_default.jpg" alt="Previsualización del logo" style="width: 100%; height: 100%; object-fit: cover;">
                    {% endif %}
                </div>
                <div class="mt-3">
                    <label for="logo_equipo" class="btn btn-primary">
                        Seleccionar Logo
                        <input type="file" id="logo_equipo" name="logo_equipo" class="d-none" accept="image/*" onchange="previewLogo(event)">
                    </label>
                </div>
                <div class="form-group">
                    <button type="button" id="clearButton" class="btn btn-warning" onclick="clearLogo()" style="display: none;">
                        Limpiar
                    </button>
                </div>
            </div>

            <div class="form-group mt-4 text-center">
                <label for="id_nombre_equipo" class="form-label" style="color: white; font-weight: bold;">Nombre del equipo</label>
                <input type="text" id="id_nombre_equipo" name="nombre_equipo" value="{{ form.nombre_equipo.value }}" class="form-control mx-auto" style="background-color: #555555; color: white; border: 1px solid white; max-width: 80%;" maxlength="100" required>
            </div>

            <div class="text-center mt-4 d-flex justify-content-center">
                <button type="submit" class="btn btn-success mr-2">
                    GUARDAR
                </button>
                <a href="{% url 'equipos' %}" class="btn btn-danger">
                    CANCELAR
                </a>
            </div>
        </form>
    </div>
</div>

<script>
    // URL de la imagen predeterminada
    const defaultLogoUrl = "media/logos/logo_default.jpg";

    document.addEventListener('DOMContentLoaded', function() {
        const logoPreview = document.getElementById('logoPreview');
        const clearButton = document.getElementById('clearButton');

        // Si la imagen cargada es diferente al logo predeterminado, mostrar el botón de limpiar
        if (logoPreview.src.indexOf(defaultLogoUrl) === -1) {
            clearButton.style.display = 'inline-block';
        }
    });

    function previewLogo(event) {
        const logoPreview = document.getElementById('logoPreview');
        const clearButton = document.getElementById('clearButton');
        const file = event.target.files[0];

        if (file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                logoPreview.src = e.target.result;
                logoPreview.style.display = 'block';
                clearButton.style.display = 'inline-block';  // Mostrar el botón
            };
            reader.readAsDataURL(file);
        }
    }

    function clearLogo() {
        const logoPreview = document.getElementById('logoPreview');
        const inputFile = document.getElementById('logo_equipo');
        const clearButton = document.getElementById('clearButton');

        // Restaurar la imagen al logo predeterminado y ocultar el botón de limpiar
        logoPreview.src = defaultLogoUrl;
        clearButton.style.display = 'none';
        inputFile.value = ''; // Limpiar el valor del input de archivo
    }
</script>
{% endblock %}
