{% extends 'administracion/base2.html' %}

{% block content %}
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">

<div class="container-fluid mt-5">
    <!-- Contenedor principal que ocupa todo el ancho -->
    <div class="p-4 text-center" style="background-color: black; color: white; width: 100%; border: 2px solid white; border-radius: 10px;">
        <h2 class="mb-4">CREAR EQUIPO</h2>

        {% if error %}
            <div class="alert alert-danger" role="alert" style="color: black; background-color: white; border-radius: 5px;">
                {{ error }}
            </div>
        {% endif %}

        <!-- Formulario centrado -->
        <form action="{% url 'equipo_crear' %}" method="POST" enctype="multipart/form-data" style="max-width: 500px; margin: 0 auto;">
            {% csrf_token %}

            <!-- Foto de Logo centrada en círculo -->
            <div class="form-group text-center">
                <div class="image-preview mx-auto" style="width: 150px; height: 150px; border-radius: 50%; background-color: black ; border: 2px solid white; overflow: hidden;">
                    <img id="logoPreview" src="" alt="Previsualización del logo" style="width: 100%; height: 100%; object-fit: cover; display: none;">
                </div>
                <div class="mt-3">
                    <label for="logo_equipo" class="btn btn-primary">
                        Seleccionar Logo
                        <input type="file" id="logo_equipo" name="logo_equipo" class="d-none" accept="image/*" onchange="previewLogo(event)">
                    </label>
                </div>
                <div class="form-group">
                    <button type="button" class="btn btn-warning" onclick="clearLogo()">
                        Limpiar
                    </button>
                </div>
            </div>

            <!-- Campo de Nombre -->
            <div class="form-group mt-4 text-center">
                <label for="id_nombre_equipo" class="form-label" style="color: white; font-weight: bold;">Nombre del equipo</label>
                <input type="text" id="id_nombre_equipo" name="nombre_equipo" class="form-control mx-auto" style="background-color: #555555; color: white; border: 1px solid white; max-width: 80%;" maxlength="100" required>
            </div>

            <!-- Botones Guardar y Cancelar -->
            <div class="text-center mt-4 d-flex justify-content-center">
                <button type="submit" class="btn btn-success mr-2">
                    GUARDAR
                </button>
                <a href="{% url 'equipos' %}" class="btn btn-danger">
                    CANCELAR
                </a>
            </div>
        </form>
    </div>
</div>

<script>
    function previewLogo(event) {
        const logoPreview = document.getElementById('logoPreview');
        const file = event.target.files[0];

        if (file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                logoPreview.src = e.target.result;
                logoPreview.style.display = 'block';
            };
            reader.readAsDataURL(file);
        }
    }

    function clearLogo() {
        const logoPreview = document.getElementById('logoPreview');
        const inputFile = document.getElementById('id_logo_equipo');

        logoPreview.src = '';
        logoPreview.style.display = 'none';
        inputFile.value = ''; // Limpia el valor del input de archivo
    }
</script>
{% endblock %}
