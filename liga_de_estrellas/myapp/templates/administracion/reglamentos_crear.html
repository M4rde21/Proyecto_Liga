{% extends 'administracion/base2.html' %}

{% block content %}
<style>
    body {
        overflow-x: hidden;
    }
</style>

<link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">

<div class="container">
    <form method="post" action="{% url 'reglamentos_crear' %}" enctype="multipart/form-data" class="w-100" style="max-width: 100%; margin: 20px auto; background-color: black; border: 2px solid white; border-radius: 5px; padding: 20px;">
        {% csrf_token %}
        <h1 style="color: white; text-transform: uppercase; text-align: center; margin-bottom: 50px;">Crear Reglamento</h1>
        
        {% if error %}
            <div class="alert alert-danger text-center" role="alert">
                {{ error }}
            </div>
        {% endif %}

        <!-- Campos del formulario -->
        <div class="form-group">
            <label for="nombre_reglamento" style="color: white; text-align: center; display: block;">Nombre del Reglamento:</label>
            <input type="text" id="nombre_reglamento" name="nombre_reglamento" class="form-control" maxlength="100" required style="background-color: black; color: white; border: 1px solid white;">
        </div>

        <div class="form-group text-center">
            <div class="custom-file" style="max-width: 300px; margin-top: -30px;">
                <input type="file" id="archivo_reglamento" name="archivo_reglamento" class="custom-file-input" required onchange="mostrarRutaArchivo()">
                <label class="btn btn-primary" for="archivo_reglamento" style="color: white; background-color: #007bff; border-color: #007bff;">
                    Elegir archivo
                </label>
            </div>
            <p id="rutaArchivo" style="color: white; margin-top: 10px;"></p> <!-- Aquí se mostrará la ruta del archivo -->
        </div>
        
        <!-- Botones de acción -->
        <div class="d-flex justify-content-center">
            <button type="submit" class="btn btn-success" style="margin: 10px; width: 150px;">
                Confirmar
            </button>
            <a href="{% url 'reglamentos_lista' %}" class="btn btn-danger" style="margin: 10px; width: 150px;">
                Volver
            </a>
        </div>
    </form>
</div>

<script>
    function mostrarRutaArchivo() {
        var input = document.getElementById("archivo_reglamento");
        var ruta = input.value.split("\\").pop(); // Obtiene solo el nombre del archivo
        document.getElementById("rutaArchivo").textContent = "Archivo seleccionado: " + ruta;
    }
</script>

{% endblock %}
