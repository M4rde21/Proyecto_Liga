{% extends 'administracion/base2.html' %}

{% block content %}

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">

<div class="container mt-5">
    <div class="p-4 mx-auto" style="background-color: black; color: white; max-width: 95%; border: 2px solid white; border-radius: 10px;">
        <h1 class="text-center mb-4">EQUIPOS</h1>
        <div class="text-center mb-4">
            <a href="{% url 'equipo_crear' %}" class="btn btn-success">
                <i class="fas fa-plus"></i> NUEVO EQUIPO
            </a>
        </div>
        
        <table class="table table-dark text-center" style="background-color: black; border: none;">
            <thead>
                <tr>
                    <th>Foto</th>
                    <th>Nombre</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody>
                {% for equipo in equipos %}
                <tr>
                    <td>
                        {% if equipo.logo_equipo %}
                            <img src="{{ equipo.logo_equipo.url }}" alt="Foto de {{ equipo.nombre_equipo }}" style="width: 40px; height: 40px;">
                        {% else %}
                            <img src="{{ MEDIA_URL }}logos/logo_default.jpg" alt="Foto no disponible" style="width: 40px; height: 40px;">
                        {% endif %}
                    </td>
                    <td>{{ equipo.nombre_equipo }}</td>
                    <td>
                        <a href="{% url 'equipo_editar' equipo.id %}" class="btn btn-primary btn-sm">
                            <i class="fas fa-edit"></i> 
                        </a>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.2/dist/umd/popper.min.js"></script>
<script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>

{% endblock %}
