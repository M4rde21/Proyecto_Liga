{% extends 'administracion/base2.html' %}

{% block content %}
<style>
    body {
        overflow-x: hidden;
    }
</style>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">

<div class="container mt-5">
    <div class="p-4 mx-auto" style="background-color: black; color: white; max-width: 95%; border: 2px solid white; border-radius: 10px;">
        <div class="text-center mb-4">
            <h1>EQUIPOS</h1>
            <!-- Botón que redirige a la página para crear un nuevo equipo -->
            <a href="{% url 'equipo_crear' %}" class="btn btn-success">
                <i class="fas fa-plus"></i> CREAR EQUIPO
            </a>
        </div>

        <!-- Barra de búsqueda -->
        <div class="mb-3">
            <input type="text" id="busqueda-equipos" style="background-color: black; color: white; border: 1px solid white;" class="form-control" placeholder="Buscar por nombre..." />
        </div>

        <!-- Tabla de equipos -->
        <table class="table table-dark text-center" style="background-color: black; border: none;">
            <thead>
                <tr>
                    <th>Logo</th>
                    <th>Nombre</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody id="tabla-equipos">
                {% for equipo in equipos %}
                <tr data-id="{{ equipo.id }}">
                    <td>
                        {% if equipo.logo_equipo %}
                            <img src="{{ equipo.logo_equipo.url }}" alt="Logo de {{ equipo.nombre_equipo }}" style="width: 40px; height: 40px;">
                        {% else %}
                            <img src="{{ MEDIA_URL }}logos/logo_default.jpg" alt="Logo no disponible" style="width: 40px; height: 40px;">
                        {% endif %}
                    </td>
                    <td>{{ equipo.nombre_equipo }}</td>
                    <td>
                        <!-- Modificado para redirigir a equipo_editar -->
                        <a href="{% url 'equipo_editar' equipo.id %}" class="btn btn-primary btn-sm">
                            <i class="fas fa-edit"></i> 
                        </a>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.2/dist/umd/popper.min.js"></script>
<script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>

<script>
// Función para previsualizar el logo al crear un nuevo equipo
function previewLogo(event) {
    const logoPreview = document.getElementById('logoPreviewCrear');
    const file = event.target.files[0];

    if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
            logoPreview.src = e.target.result;
            logoPreview.style.display = 'block';
        };
        reader.readAsDataURL(file);
    }
}

// Función para filtrar los equipos
$(document).ready(function() {
    $('#busqueda-equipos').on('keyup', function() {
        var value = $(this).val().toLowerCase();
        $('#tabla-equipos tr').filter(function() {
            $(this).toggle($(this).text().toLowerCase().indexOf(value) > -1);
        });
    });
});
</script>

{% endblock %}
