{% extends 'administracion/base2.html' %}

{% block content %}
<!-- Asegúrate de tener Font Awesome en tu proyecto para usar íconos -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">

<div class="container mt-5">
    <!-- Contenedor con fondo negro y borde blanco -->
    <div class="p-4 mx-auto" style="background-color: black; color: white; max-width: 95%; border: 2px solid white; border-radius: 10px;">

        <!-- Título y botón centrados -->
        <div class="text-center mb-4">
            <h1>CATEGORÍAS</h1>
            <form action="{% url 'crear_categoria' %}" method="get">
                <button type="submit" class="btn btn-success">
                    <i class="fas fa-plus"></i> <!-- Ícono de agregar -->
                    CREAR CATEGORIA
                </button>
            </form>
        </div>

        <!-- Tabla de categorías -->
        <table class="table table-dark text-center" style="background-color: black; border: none;">
            <thead>
                <tr>
                    <th>Nombre</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody>
                {% for categoria in categorias %}
                <tr>
                    <td>{{ categoria.nombre_categoria }}</td>
                    <td>
                        <!-- Botones Modificar y Eliminar con íconos -->
                        <form action="{% url 'edit_categoria' categoria.id_categoria %}" method="get" style="display:inline;">
                            <button type="submit" class="btn btn-primary btn-sm">
                                <i class="fas fa-edit"></i> <!-- Ícono de editar -->
                            </button>
                        </form>

                        <!-- Botón para abrir el modal de eliminación -->
                        <button type="button" class="btn btn-danger btn-sm" data-toggle="modal" data-target="#confirmDeleteModal{{ categoria.id_categoria }}">
                            <i class="fas fa-trash-alt"></i> <!-- Ícono de eliminar -->
                        </button>

                        <!-- Modal de confirmación -->
                        <div class="modal fade" id="confirmDeleteModal{{ categoria.id_categoria }}" tabindex="-1" role="dialog" aria-labelledby="confirmDeleteModalLabel" aria-hidden="true">
                            <div class="modal-dialog" role="document">
                                <div class="modal-content" style="background-color: black; border-radius: 20px; border: 2px solid white;">
                                    <div class="modal-header">
                                        <h5 class="modal-title" id="confirmDeleteModalLabel" style="color: white;">Confirmar Eliminación</h5>
                                        <button type="button" class="close" data-dismiss="modal" aria-label="Cerrar">
                                            <span aria-hidden="true">&times;</span>
                                        </button>
                                    </div>
                                    <div class="modal-body" style="color: white;">
                                        ¿Estás seguro de que deseas eliminar esta categoría?
                                    </div>
                                    <div class="modal-footer">
                                        <button type="button" class="btn btn-secondary" data-dismiss="modal">Cancelar</button>
                                        <form action="{% url 'delete_categoria' categoria.id_categoria %}" method="post" id="deleteForm{{ categoria.id_categoria }}">
                                            {% csrf_token %}
                                            <button type="submit" class="btn btn-danger">Eliminar</button>
                                        </form>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>

<!-- Asegúrate de incluir jQuery y Bootstrap JS -->
<script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.2/dist/umd/popper.min.js"></script>
<script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>

{% endblock %}
