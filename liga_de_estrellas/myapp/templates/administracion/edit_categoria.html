{% extends 'administracion/base2.html' %}

{% block content %}

<div class="container mt-5">
    <div class="p-4 mx-auto" style="background-color: black; color: white; max-width: 95%; border: 2px solid white; border-radius: 10px;">

        <div class="text-center mb-4">
            <h1>{{ categoria.nombre_categoria }}</h1>
        </div>

        {% if error %}
        <div class="alert alert-danger">
            {{ error }}
        </div>
        {% endif %}

        <form method="POST" action="{% url 'edit_categoria' categoria.id %}">
            {% csrf_token %}
            {{ form.as_p }}

            <div class="text-center mt-4">
                <button type="submit" class="btn btn-primary">
                    <i class="fas fa-save"></i> 
                    Actualizar
                </button>
            </div>
        </form>

        <div class="text-center mt-3">
            <form action="{% url 'categorias_adm' %}" method="get" style="display:inline;">
                <button type="submit" class="btn btn-secondary">
                    <i class="fas fa-arrow-left"></i> 
                    Volver atrás
                </button>
            </form>
        </div>
    </div>
</div>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">

{% endblock %}
