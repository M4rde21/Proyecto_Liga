{% extends 'administracion/base2.html' %}

{% block content %}
<style>
    body {
        overflow-x: hidden;
    }
</style>

<link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">

<div class="container">
    <form method="POST" enctype="multipart/form-data" class="w-100" style="max-width: 100%; margin: 20px auto; background-color: black; border: 2px solid white; border-radius: 5px; padding: 20px;">
        {% csrf_token %}
        <h1 style="color: white; text-transform: uppercase; text-align: center; margin-bottom: 50px;">Editar Reglamento</h1>

        {% if error %}
            <div class="alert alert-danger text-center" role="alert">
                {{ error }}
            </div>
        {% endif %}

        <!-- Mostrar el nombre del reglamento actual -->
        <div class="form-group">
            <label for="nombre_reglamento" style="color: white; text-align: center; display: block;">Nombre del Reglamento:</label>
            <input type="text" id="nombre_reglamento" name="nombre_reglamento" class="form-control" maxlength="100" value="{{ reglamento.nombre_reglamento }}" required style="background-color: black; color: white; border: 1px solid white;">
        </div>

        <div class="form-group text-center" style="margin-top: 20px;">
            <div class="custom-file" style="max-width: 300px; margin-top: -30px;">
                <input type="file" id="archivo_reglamento" name="archivo_reglamento" class="custom-file-input">
                <label class="btn btn-primary" for="archivo_reglamento" style="color: white; background-color: #007bff; border-color: #007bff;">
                    Elegir archivo
                </label>
            </div>
            <!-- Checkbox para eliminar el reglamento -->
            <div class="form-check" style="margin-top: 20px;">
                <input type="checkbox" class="form-check-input" id="eliminar_reglamento" name="eliminar_reglamento" style="margin-right: 10px;">
                <label class="form-check-label" for="eliminar_reglamento" style="color: white;">Eliminar este reglamento</label>
            </div>
        </div>

        <!-- Mostrar el nombre del archivo actual si existe -->
        {% if reglamento.archivo_reglamento %}
            <div class="form-group text-center" style="margin-top: 20px;">
                <label for="archivo_actual" style="color: white; display: block;">Archivo Actual:</label>
                <p style="color: white;">{{ reglamento.archivo_reglamento.name }}</p>
            </div>
        {% endif %}

        <!-- Botones de acción -->
        <div class="d-flex justify-content-center" style="margin-top: 30px;">
            <button type="submit" class="btn btn-success" style="margin: 10px; width: 150px;">
                Confirmar
            </button>
            <a href="{% url 'reglamentos_lista' %}" class="btn btn-danger" style="margin: 10px; width: 150px;">
                Volver
            </a>
        </div>
    </form>
</div>

{% endblock %}
