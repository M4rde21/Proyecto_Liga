{% extends 'administracion/base2.html' %}
{% block content %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Traspaso</title>
</head>
<body>
    <form action="{% url 'traspasos_editar' traspaso.id %}" method="POST">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">GUARDAR</button>
    </form>
    <a href="{% url 'traspasos' %}">
        <button type="submit">CANCELAR</button>
    </a>
    {% if messages %}
        <ul>
            {% for message in messages %}
                <li style="color: red;">{{ message }}</li>
            {% endfor %}
        </ul>
    {% endif %}
</body>
</html>
{% endblock %}
