{% extends 'base.html' %}

{% block content %}
    <h1>Avisos Activos</h1>
    <ul>
        {% for aviso in avisos %}
            <li>
                <h2>{{ aviso.titulo }}</h2>
                <p>{{ aviso.contenido }}</p>
            </li>
        {% empty %}
            <li>No hay avisos activos en este momento.</li>
        {% endfor %}
    </ul>
{% endblock %}
